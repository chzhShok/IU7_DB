services:
  postgres_streaming_service:
    image: postgres:17
    container_name: postgres_university
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streaming_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /Users/evailcenko/baumanka/db/labs/IU7_DB/lab_05/json:/tmp
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y postgresql-plpython3-18 &&
        docker-entrypoint.sh postgres
      "
    networks:
        - my_persistent_network

  redis:
    image: redis:8.4
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - my_persistent_network
    depends_on:
      - postgres_streaming_service

  # configuration manager for NiFi
  zookeeper:
      hostname: myzookeeper
      container_name: zookeeper_container_persistent
      image: 'zookeeper:latest'
      restart: on-failure
      environment:
          - ALLOW_ANONYMOUS_LOGIN=yes
      networks:
          - my_persistent_network

  # version control for nifi flows
  registry:
      hostname: myregistry
      container_name: registry_container_persistent
      image: 'apache/nifi-registry:2.6.0'
      restart: on-failure
      ports:
          - "18080:18080"
      environment:
          - LOG_LEVEL=INFO
          - NIFI_REGISTRY_DB_DIR=/opt/nifi-registry/nifi-registry-current/database
          - NIFI_REGISTRY_FLOW_PROVIDER=file
          - NIFI_REGISTRY_FLOW_STORAGE_DIR=/opt/nifi-registry/nifi-registry-current/flow_storage
      volumes:
          - ./nifi_registry/database:/opt/nifi-registry/nifi-registry-current/database
          - ./nifi_registry/flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      networks:
          - my_persistent_network

  # data extraction, transformation and load service
  nifi:
      hostname: mynifi
      container_name: nifi_container_persistent
      image: 'apache/nifi:2.6.0'
      restart: on-failure
      ports:
          - '8091:8443'
      environment:
          - NIFI_WEB_HTTP_PORT=8080
          - NIFI_CLUSTER_IS_NODE=true
          - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
          - NIFI_ZK_CONNECT_STRING=myzookeeper:2181
          - NIFI_ELECTION_MAX_WAIT=30 sec
          - NIFI_SENSITIVE_PROPS_KEY='12345678901234567890A'
          - NIFI_WEB_PROXY_HOST=localhost:8091
      healthcheck:
          test: "${DOCKER_HEALTHCHECK_TEST:-curl localhost:8091/nifi/}"
          interval: "60s"
          timeout: "3s"
          start_period: "5s"
          retries: 5
      volumes:
          - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
          - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
          - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
          - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
          - ./nifi/state:/opt/nifi/nifi-current/state
          - ./nifi/logs:/opt/nifi/nifi-current/logs
          - ./nifi/jks:/opt/nifi/nifi-current/jks
          - ./nifi/in_file:/opt/nifi/nifi-current/in_file
      networks:
          - my_persistent_network

  # bi grafana
  grafana:
      image: grafana/grafana:12.1
      container_name: grafana_container
      restart: always
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: password
        GF_SERVER_ROOT_URL: http://localhost:3000/grafana/
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      user: "472:472"
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - postgres_streaming_service
      networks:
        - my_persistent_network

networks:
  my_persistent_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
